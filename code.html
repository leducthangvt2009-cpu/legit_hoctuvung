<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz từ vựng C1/C2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;800&family=Newsreader:ital,opsz,wght@0,6..72,500;1,6..72,500&display=swap" rel="stylesheet">
<style>
  :root {
    --font-ui: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --font-serif: 'Newsreader', Georgia, 'Times New Roman', serif;

    --bg: #E8EBFF;
    --paper: #FFFFFF;
    --ink: #16194A;
    --muted: #5B6094;
    --line: #D3D8F6;
    --chip: #EEF0FF;
    --primary: #4F46E5;
    --primary-ink: #FFFFFF;
    --mark: #FFE35A;
    --mark-ink: #16194A;
    --good: #0E9F6E;
    --good-bg: #DCF6EA;
    --bad: #E0393F;
    --bad-bg: #FFE4E5;
    --shadow: 0 1px 2px rgba(22,25,74,.06), 0 12px 32px -12px rgba(22,25,74,.22);

    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0E1030;
      --paper: #181B4A;
      --ink: #EEF0FF;
      --muted: #A5AADF;
      --line: #2C3073;
      --chip: #252965;
      --primary: #8F89FF;
      --primary-ink: #0E1030;
      --good: #34D399;
      --good-bg: #0F3F35;
      --bad: #FF7B81;
      --bad-bg: #4B1F36;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px -12px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1030;
    --paper: #181B4A;
    --ink: #EEF0FF;
    --muted: #A5AADF;
    --line: #2C3073;
    --chip: #252965;
    --primary: #8F89FF;
    --primary-ink: #0E1030;
    --good: #34D399;
    --good-bg: #0F3F35;
    --bad: #FF7B81;
    --bad-bg: #4B1F36;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px -12px rgba(0,0,0,.6);
  }

  html { background: var(--bg); scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-ui);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; color: inherit; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }

  .app { max-width: 760px; margin: 0 auto; padding: 28px 18px 48px; }

  /* Header */
  .top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
  .top h1 { margin: 0; font-size: clamp(26px, 5vw, 34px); font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; }
  .top p { margin: 4px 0 0; color: var(--muted); font-size: 15px; }
  .ghost {
    background: transparent; border: 1.5px solid var(--line); color: var(--muted);
    padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer;
    transition: border-color .15s, color .15s;
    white-space: nowrap;
  }
  .ghost:hover { border-color: var(--primary); color: var(--ink); }

  /* Stats */
  .stats {
    display: grid; grid-template-columns: repeat(3, 1fr);
    background: var(--paper); border: 1px solid var(--line); border-radius: 16px;
    box-shadow: var(--shadow);
  }
  .stat { padding: 12px 8px; text-align: center; }
  .stat + .stat { border-left: 1px solid var(--line); }
  .stat .num { display: block; font-size: 26px; font-weight: 800; line-height: 1.1; letter-spacing: -0.02em; }
  .stat .lbl { display: block; margin-top: 2px; font-size: 12.5px; color: var(--muted); }
  .pop { animation: pop .35s cubic-bezier(.3,1.6,.5,1); }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.3); } 100% { transform: scale(1); } }

  /* Progress */
  .progress { display: flex; align-items: center; gap: 12px; margin: 16px 2px 20px; }
  .bar { flex: 1; height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--primary); border-radius: 999px; transition: width .5s cubic-bezier(.3,.7,.2,1); }
  .progress span { font-size: 13px; color: var(--muted); font-weight: 600; white-space: nowrap; }

  /* Card */
  .card {
    background: var(--paper); border: 1px solid var(--line); border-radius: 22px;
    box-shadow: var(--shadow); padding: 34px 30px 28px;
  }
  .sentence {
    margin: 0 0 26px;
    font-family: var(--font-serif); font-style: italic; font-weight: 500;
    font-size: clamp(23px, 4.8vw, 31px); line-height: 1.42; letter-spacing: -0.005em;
    color: var(--ink);
  }
  mark {
    color: var(--ink);
    background: linear-gradient(var(--mark), var(--mark)) no-repeat 0 92% / 0% 72%;
    padding: 0 .14em; margin: 0 -.14em;
    font-style: normal; font-weight: 500;
    -webkit-box-decoration-break: clone; box-decoration-break: clone;
    animation: sweep .75s .3s cubic-bezier(.3,.7,.2,1) forwards;
  }
  @keyframes sweep { to { background-size: 100% 72%; color: var(--mark-ink); } }

  .ask { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 10px; margin: 0 0 18px; font-size: 17px; font-weight: 600; }
  .ask .hw { font-family: var(--font-serif); font-style: italic; font-size: 22px; font-weight: 500; color: var(--primary); }
  .pos { font-size: 12.5px; font-weight: 600; color: var(--muted); background: var(--chip); padding: 2px 10px; border-radius: 999px; }

  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--chip); border: 0; color: var(--primary);
    min-width: 36px; height: 36px; padding: 0 10px; border-radius: 10px; cursor: pointer;
    font-size: 13px; font-weight: 600;
    transition: transform .12s, filter .12s;
  }
  .icon-btn:hover { filter: brightness(.96); transform: translateY(-1px); }
  .icon-btn svg { width: 18px; height: 18px; fill: currentColor; }

  /* Options */
  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .opt {
    position: relative; display: flex; align-items: center; gap: 12px; text-align: left;
    background: var(--paper); border: 2px solid var(--line); border-radius: 14px;
    padding: 14px 44px 14px 14px; font-size: 16px; font-weight: 600; line-height: 1.35; cursor: pointer;
    transition: border-color .15s, background-color .15s, transform .15s, opacity .2s;
  }
  .opt:hover:not(:disabled) { border-color: var(--primary); transform: translateY(-2px); }
  .opt:disabled { cursor: default; }
  .opt .key {
    flex: none; width: 30px; height: 30px; display: grid; place-items: center;
    border-radius: 9px; background: var(--chip); color: var(--muted); font-size: 14px; font-weight: 800;
  }
  .opt .tick { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-size: 18px; font-weight: 800; }
  .opt.correct { border-color: var(--good); background: var(--good-bg); }
  .opt.correct .key { background: var(--good); color: #fff; }
  .opt.correct .tick { color: var(--good); }
  .opt.correct .tick::after { content: '✓'; }
  .opt.wrong { border-color: var(--bad); background: var(--bad-bg); animation: shake .35s; }
  .opt.wrong .key { background: var(--bad); color: #fff; }
  .opt.wrong .tick { color: var(--bad); }
  .opt.wrong .tick::after { content: '✕'; }
  .opt.dim { opacity: .5; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

  /* Result */
  .result {
    margin-top: 20px; padding: 16px 18px; border-radius: 14px; border: 1.5px solid;
    animation: rise .25s ease-out;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .result.good { background: var(--good-bg); border-color: var(--good); }
  .result.bad { background: var(--bad-bg); border-color: var(--bad); }
  .r-title { margin: 0; font-weight: 800; font-size: 18px; }
  .result.good .r-title { color: var(--good); }
  .result.bad .r-title { color: var(--bad); }
  .r-line { margin: 4px 0 0; font-size: 16px; }
  .r-line strong { font-family: var(--font-serif); font-style: italic; font-size: 19px; font-weight: 500; }
  .r-note { margin: 4px 0 0; font-size: 14px; color: var(--muted); }
  .r-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 14px; }
  .spacer { flex: 1; }
  .next {
    display: inline-flex; align-items: center; gap: 10px;
    background: var(--primary); color: var(--primary-ink); border: 0; cursor: pointer;
    padding: 12px 22px; border-radius: 12px; font-size: 16px; font-weight: 700;
    box-shadow: 0 6px 16px -6px var(--primary);
    transition: transform .12s, filter .12s;
  }
  .next:hover { transform: translateY(-2px); filter: brightness(1.06); }
  .next kbd {
    font-family: inherit; font-size: 12px; font-weight: 600; padding: 1px 7px; border-radius: 6px;
    background: rgba(255,255,255,.22); color: inherit;
  }
  :root[data-theme="dark"] .next kbd { background: rgba(14,16,48,.18); }
  .hint { margin: 18px 0 0; text-align: center; font-size: 13px; color: var(--muted); }
  @media (hover: none) { .hint, .next kbd { display: none; } }

  /* Finish */
  .finish { text-align: center; }
  .finish h2 { margin: 0 0 6px; font-size: clamp(24px, 5vw, 30px); font-weight: 800; letter-spacing: -0.02em; }
  .finish > p { margin: 0 0 22px; color: var(--muted); }
  .summary { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 24px; }
  .missed-title { margin: 0 0 10px; font-weight: 700; text-align: left; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 24px; padding: 0; list-style: none; text-align: left; }
  .chips li { background: var(--chip); border-radius: 10px; padding: 6px 12px; font-size: 14px; }
  .chips b { font-family: var(--font-serif); font-style: italic; font-weight: 500; font-size: 16px; }

  @media (max-width: 600px) {
    .app { padding: 20px 14px 40px; }
    .card { padding: 24px 18px 22px; border-radius: 18px; }
    .options { grid-template-columns: 1fr; }
    .stat .num { font-size: 22px; }
    .top p { font-size: 14px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    mark { background-size: 100% 72% !important; color: var(--mark-ink) !important; }
  }
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <div>
      <h1>Từ vựng C1/C2</h1>
      <p>Đoán nghĩa của từ được tô sáng trong câu</p>
    </div>
    <button class="ghost" id="reset" type="button">Làm lại từ đầu</button>
  </header>

  <section class="stats" aria-label="Thống kê">
    <div class="stat"><span class="num" id="s-score">0</span><span class="lbl">Câu đúng</span></div>
    <div class="stat"><span class="num" id="s-streak">0</span><span class="lbl" id="s-best">Chuỗi đúng</span></div>
    <div class="stat"><span class="num" id="s-acc">–</span><span class="lbl">Chính xác</span></div>
  </section>

  <div class="progress">
    <div class="bar" role="progressbar" aria-label="Số từ đã thuộc" id="bar-wrap" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="bar"></i></div>
    <span id="prog-text">Đã thuộc 0/0</span>
  </div>

  <section class="card" id="quiz">
    <p class="sentence" id="context"></p>

    <p class="ask">
      <span class="hw" id="headword"></span>
      <span>nghĩa là gì?</span>
      <span class="pos" id="pos" hidden></span>
      <button class="icon-btn" id="say-word-top" type="button" aria-label="Nghe phát âm từ" title="Nghe phát âm"></button>
    </p>

    <div class="options" id="options" role="group" aria-label="Các đáp án"></div>

    <div class="result" id="result" role="status" aria-live="polite" hidden></div>

    <p class="hint">Dùng phím A–D (hoặc 1–4) để chọn, Enter để sang câu tiếp.</p>
  </section>

  <section class="card finish" id="finish" hidden>
    <h2 id="f-title">Hoàn thành!</h2>
    <p id="f-sub"></p>
    <div class="summary stats" style="box-shadow:none">
      <div class="stat"><span class="num" id="f-words">0</span><span class="lbl">Từ đã thuộc</span></div>
      <div class="stat"><span class="num" id="f-acc">0%</span><span class="lbl">Chính xác</span></div>
      <div class="stat"><span class="num" id="f-streak">0</span><span class="lbl">Chuỗi dài nhất</span></div>
    </div>
    <div id="missed-wrap" hidden>
      <p class="missed-title" id="missed-title"></p>
      <ul class="chips" id="missed-list"></ul>
    </div>
    <button class="next" id="again" type="button">Học lại từ đầu</button>
  </section>
</main>

  /* ---------- Chuẩn bị dữ liệu ---------- */
  const POS_LABEL = { adj: 'tính từ', n: 'danh từ', adv: 'trạng từ', v: 'động từ' };

  function getPos(e) {
    const groups = [...e.matchAll(/\(([^)]*)\)/g)].map(m => m[1]);
    for (const g of groups) {
      const k = g.split('/')[0].trim();
      if (k === 'adj' || k === 'n' || k === 'adv') return k;
    }
    return /^to /i.test(e) ? 'v' : null;
  }
  function extractBaseWord(e) {
    return e.replace(/^to /i, '').replace(/\s*\([^)]*\)/g, '').trim();
  }
  vocab.forEach(w => {
    w.pos = getPos(w.e);
    w.head = w.e.replace(/\s*\((?:adj|n|adv)[^)]*\)/i, '').trim();
    w.base = extractBaseWord(w.e);
  });

  /* ---------- Trạng thái ---------- */
  const $ = id => document.getElementById(id);
  const BEST_KEY = 'c1c2-best-streak';
  let queue = [], current = null, options = [];
  let mastered, missed, score, answeredCount, streak, sessionBest, answered, bestStreak = 0;

  try { bestStreak = parseInt(localStorage.getItem(BEST_KEY), 10) || 0; } catch (e) {}

  const SPEAKER = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10v4h4l5 4V6L7 10H3zm13.5 2a4.5 4.5 0 0 0-2.5-4.03v8.05A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z"/></svg>';
  const canSpeak = 'speechSynthesis' in window;

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function speak(text) {
    if (!canSpeak) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.9;
    speechSynthesis.speak(u);
  }
  function escapeRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

  /* ---------- Câu ngữ cảnh + tô sáng ---------- */
  function renderSentence(el, text, base) {
    el.textContent = '';
    let m = new RegExp('\\b' + escapeRe(base) + '[a-z]*', 'i').exec(text);
    if (!m && base.length > 4) m = new RegExp('\\b' + escapeRe(base.slice(0, -1)) + '[a-z]*', 'i').exec(text);
    el.append('\u201C');
    if (m) {
      el.append(text.slice(0, m.index));
      const mk = document.createElement('mark');
      mk.textContent = m[0];
      el.append(mk, text.slice(m.index + m[0].length));
    } else {
      el.append(text);
    }
    el.append('\u201D');
  }

  /* ---------- Đáp án nhiễu: ưu tiên cùng loại từ ---------- */
  function buildOptions(correct) {
    const pool = vocab.filter(w => w !== correct && w.v !== correct.v);
    const same = shuffle(pool.filter(w => w.pos && w.pos === correct.pos));
    const other = shuffle(pool.filter(w => !(w.pos && w.pos === correct.pos)));
    const picks = [];
    for (const w of [...same, ...other]) {
      if (picks.length >= 3) break;
      if (!picks.some(p => p.v === w.v)) picks.push(w);
    }
    return shuffle([correct, ...picks]);
  }

  /* ---------- Giao diện ---------- */
  function bump(el) {
    el.classList.remove('pop');
    void el.offsetWidth;
    el.classList.add('pop');
  }
  function updateStats(popStreak) {
    $('s-score').textContent = score;
    $('s-streak').textContent = streak;
    $('s-best').textContent = 'Chuỗi (kỷ lục ' + Math.max(bestStreak, sessionBest) + ')';
    $('s-acc').textContent = answeredCount ? Math.round(score / answeredCount * 100) + '%' : '–';
    const pct = Math.round(mastered.size / vocab.length * 100);
    $('bar').style.width = pct + '%';
    $('bar-wrap').setAttribute('aria-valuenow', pct);
    $('prog-text').textContent = 'Đã thuộc ' + mastered.size + '/' + vocab.length;
    if (popStreak) bump($('s-streak'));
  }

  function nextQuestion() {
    if (!queue.length) { showFinish(); return; }
    current = queue.shift();
    answered = false;
    options = buildOptions(current);

    renderSentence($('context'), current.c, current.base);
    $('headword').textContent = current.head;
    const pos = $('pos');
    if (current.pos) { pos.textContent = POS_LABEL[current.pos]; pos.hidden = false; } else { pos.hidden = true; }
    $('result').hidden = true;

    const box = $('options');
    box.textContent = '';
    const labels = ['A', 'B', 'C', 'D'];
    options.forEach((opt, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'opt';
      const k = document.createElement('span'); k.className = 'key'; k.textContent = labels[i];
      const t = document.createElement('span'); t.textContent = opt.v;
      const tick = document.createElement('span'); tick.className = 'tick'; tick.setAttribute('aria-hidden', 'true');
      b.append(k, t, tick);
      b.addEventListener('click', () => choose(i));
      box.append(b);
    });
  }

  function choose(i) {
    if (answered) return;
    answered = true;
    answeredCount++;
    const ok = options[i] === current;

    [...$('options').children].forEach((b, idx) => {
      b.disabled = true;
      if (options[idx] === current) b.classList.add('correct');
      else if (idx === i) b.classList.add('wrong');
      else b.classList.add('dim');
    });

    if (ok) {
      score++;
      streak++;
      mastered.add(current);
      if (streak > sessionBest) sessionBest = streak;
      if (streak > bestStreak) {
        bestStreak = streak;
        try { localStorage.setItem(BEST_KEY, String(bestStreak)); } catch (e) {}
      }
    } else {
      streak = 0;
      missed.add(current);
      const pos = Math.min(queue.length, 5 + Math.floor(Math.random() * 4));
      queue.splice(pos, 0, current);
    }
    updateStats(ok);
    showResult(ok);
  }

  function showResult(ok) {
    const r = $('result');
    r.className = 'result ' + (ok ? 'good' : 'bad');
    r.textContent = '';

    const title = document.createElement('p');
    title.className = 'r-title';
    title.textContent = ok ? (streak >= 3 ? 'Chính xác! Chuỗi ' + streak + ' câu liên tiếp.' : 'Chính xác!') : 'Chưa đúng rồi.';

    const line = document.createElement('p');
    line.className = 'r-line';
    const strong = document.createElement('strong');
    strong.textContent = current.head;
    line.append(strong, ': ' + current.v);

    r.append(title, line);
    if (!ok) {
      const note = document.createElement('p');
      note.className = 'r-note';
      note.textContent = 'Từ này sẽ quay lại sau ít câu để bạn ôn lại.';
      r.append(note);
    }

    const actions = document.createElement('div');
    actions.className = 'r-actions';
    if (canSpeak) {
      const w = document.createElement('button');
      w.type = 'button'; w.className = 'icon-btn'; w.innerHTML = SPEAKER + '<span>Từ</span>';
      w.setAttribute('aria-label', 'Nghe phát âm từ');
      w.addEventListener('click', () => speak(current.base));
      const s = document.createElement('button');
      s.type = 'button'; s.className = 'icon-btn'; s.innerHTML = SPEAKER + '<span>Câu</span>';
      s.setAttribute('aria-label', 'Nghe cả câu');
      s.addEventListener('click', () => speak(current.c));
      actions.append(w, s);
    }
    const sp = document.createElement('span'); sp.className = 'spacer';
    const next = document.createElement('button');
    next.type = 'button'; next.className = 'next';
    const last = !queue.length;
    next.append(last ? 'Xem kết quả' : 'Câu tiếp theo');
    const kbd = document.createElement('kbd'); kbd.textContent = 'Enter';
    next.append(kbd);
    next.addEventListener('click', nextQuestion);
    actions.append(sp, next);
    r.append(actions);
    r.hidden = false;
  }

  function showFinish() {
    $('quiz').hidden = true;
    $('finish').hidden = false;
    $('f-title').textContent = 'Hoàn thành! Bạn đã thuộc cả ' + vocab.length + ' từ.';
    $('f-sub').textContent = missed.size
      ? 'Có ' + missed.size + ' từ bạn từng trả lời sai. Ôn lại chúng bên dưới nhé.'
      : 'Bạn trả lời đúng tất cả ngay từ lần đầu. Rất ấn tượng!';
    $('f-words').textContent = mastered.size;
    $('f-acc').textContent = answeredCount ? Math.round(score / answeredCount * 100) + '%' : '0%';
    $('f-streak').textContent = sessionBest;

    const wrap = $('missed-wrap');
    const list = $('missed-list');
    list.textContent = '';
    if (missed.size) {
      $('missed-title').textContent = 'Từ cần ôn lại (' + missed.size + ')';
      [...missed].forEach(w => {
        const li = document.createElement('li');
        const b = document.createElement('b'); b.textContent = w.head;
        li.append(b, ': ' + w.v);
        list.append(li);
      });
      wrap.hidden = false;
    } else {
      wrap.hidden = true;
    }
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function start() {
    queue = shuffle(vocab);
    mastered = new Set();
    missed = new Set();
    score = 0; answeredCount = 0; streak = 0; sessionBest = 0;
    $('finish').hidden = true;
    $('quiz').hidden = false;
    updateStats(false);
    nextQuestion();
  }

  /* ---------- Sự kiện ---------- */
  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if ($('quiz').hidden) return;
    const k = e.key.toLowerCase();
    if (!answered) {
      const idx = 'abcd'.indexOf(k) >= 0 && k.length === 1 ? 'abcd'.indexOf(k) : ['1', '2', '3', '4'].indexOf(k);
      if (idx >= 0 && idx < options.length) { e.preventDefault(); choose(idx); }
    } else if (k === 'enter' || k === ' ') {
      if (e.target.closest && e.target.closest('button')) return; // để nút tự xử lý
      e.preventDefault();
      nextQuestion();
    }
  });

  let resetTimer = null;
  $('reset').addEventListener('click', () => {
    const btn = $('reset');
    if (resetTimer) {
      clearTimeout(resetTimer); resetTimer = null;
      btn.textContent = 'Làm lại từ đầu';
      start();
    } else {
      btn.textContent = 'Bấm lần nữa để xác nhận';
      resetTimer = setTimeout(() => { resetTimer = null; btn.textContent = 'Làm lại từ đầu'; }, 3000);
    }
  });
  $('again').addEventListener('click', start);

  const topSay = $('say-word-top');
  if (canSpeak) {
    topSay.innerHTML = SPEAKER;
    topSay.addEventListener('click', () => current && speak(current.base));
  } else {
    topSay.hidden = true;
  }

  start();
</script>
</body>
</html>
